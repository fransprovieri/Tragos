:root{
  --ink:#2A1D16; --paper:#FBF6EE; --cream:#FFF6EE;
  --font:ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --accent:#E8A33D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#17100c;font-family:var(--font);color:var(--ink)}
body{display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--ink);overflow:hidden}

/* ---------- barra de arriba (siempre visible) ---------- */
.top{flex:none;background:var(--ink);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;z-index:5}
.search{display:flex;align-items:center;gap:8px;background:var(--cream);border-radius:999px;padding:0 6px 0 14px;height:44px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.search svg{flex:none;opacity:.55}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none;height:100%}
.search input::placeholder{color:#8a7a6c}
.search button{border:0;background:#e8dccb;color:#6b5a4a;width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;display:none;cursor:pointer}
.search.has button{display:block}
.tabs{display:flex;gap:6px;margin-top:10px;position:relative}
.tab{flex:1;border:0;border-radius:999px;height:34px;font:inherit;font-weight:700;font-size:13.5px;letter-spacing:.2px;color:#d9c7b0;background:rgba(255,255,255,.08);cursor:pointer;transition:background .2s,color .2s}
.tab.on{background:var(--accent);color:#2A1D16}
body[data-bar="tiki"]{--accent:#58C4A8}
body[data-bar="classic"]{--accent:#E2B857}
body[data-bar="arg"]{--accent:#8EC5E8}

/* ---------- bares ---------- */
.stage{flex:1;min-height:0;position:relative}
.pager{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.bar{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:none}
.roof,.wall,.counter{width:100%;background-repeat:no-repeat}
.roof{aspect-ratio:390/230;background-size:100% 100%;position:relative}
.counter{aspect-ratio:390/260;background-size:100% 100%}
.wall{background-size:100% auto;background-repeat:repeat-y;padding:4px 40px 12px}
.tiki .roof{background-image:var(--tiki-top)} .tiki .wall{background-image:var(--tiki-mid)} .tiki .counter{background-image:var(--tiki-bot)}
.classic .roof{background-image:var(--classic-top)} .classic .wall{background-image:var(--classic-mid)} .classic .counter{background-image:var(--classic-bot)}
.arg .roof{background-image:var(--arg-top)} .arg .wall{background-image:var(--arg-mid)} .arg .counter{background-image:var(--arg-bot)}
.counter{margin-top:-1px}

/* carteles */
.sign{position:absolute;left:50%;transform:translateX(-50%);text-align:center;border-radius:10px;padding:8px 14px 7px;line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.sign b{display:block;font-size:clamp(18px,6.4vw,28px);letter-spacing:2px;font-weight:900;text-transform:uppercase;white-space:nowrap}
.sign small{display:block;margin-top:5px;font-size:11px;font-weight:700;letter-spacing:.6px;opacity:.85}
.tiki .sign{top:41%;width:62%;background:#7A4A2B;color:#F9E4B4;border:3px solid #A8703F;outline:2px solid #4b2a14;outline-offset:-1px}
.classic .sign{top:43%;width:46%;background:#2A130E;color:#E8C877;border:2px solid #D9B25F;outline:2px solid #2A130E;outline-offset:-6px}
.arg .sign{top:21%;width:58%;background:#fff;color:#2F6D9A;border:3px solid #8EC5E8}

/* títulos de estante */
.shelf-title{margin:18px 0 10px;font-size:14px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;text-align:center}
.shelf-title span{display:inline-block;padding:5px 14px;border-radius:999px}
.tiki .shelf-title span{background:#7A4A2B;color:#F9E4B4}
.classic .shelf-title span{background:#2A130E;color:#E8C877;border:1.5px solid #D9B25F}
.arg .shelf-title span{background:#8EC5E8;color:#173f5a}
.arg .wall{color:#173f5a}
.classic .sign b{font-size:clamp(14px,4.6vw,22px);letter-spacing:1px}
.classic .sign{padding:8px 8px 7px}
.empty{margin:4px 0 6px;padding:14px;border-radius:14px;background:rgba(255,255,255,.85);text-align:center;font-size:13.5px;font-weight:600;color:#5b6b78}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.tile{position:relative;cursor:pointer;outline:none;-webkit-user-select:none;user-select:none}
.tile:active{transform:scale(.97)}
.tile img{display:block;width:100%;aspect-ratio:1;border-radius:16px;border:3px solid var(--cream);box-shadow:0 5px 0 rgba(0,0,0,.28);background:#ddd}
.plaque{margin:9px auto 0;width:fit-content;max-width:100%;padding:4px 10px;border-radius:999px;font-weight:800;font-size:13px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiki .plaque{background:#7A4A2B;color:#F9E4B4}
.classic .plaque{background:#2A130E;color:#E8C877;border:1.5px solid #D9B25F}
.arg .plaque{background:#fff;color:#2F6D9A}
.fav{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(42,29,22,.55);color:#fff;font-size:18px;line-height:1;cursor:pointer;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.fav.on{background:#F6B93B;color:#7a4a00}
.pad{height:6px}

/* ---------- resultados de búsqueda ---------- */
.results{position:absolute;inset:0;background:#F6EFE3;overflow-y:auto;padding:16px 16px 40px;display:none;z-index:4}
.results.show{display:block}
.results .count{font-size:13px;font-weight:700;color:#7a6a5c;margin:0 0 12px}
.results .tile .plaque{background:#2A1D16;color:#F6E3B8}
.results .tile .origin{display:block;text-align:center;font-size:11px;color:#8a7a6c;margin-top:3px;font-weight:600}
.none{text-align:center;color:#7a6a5c;margin-top:50px;font-weight:600}

/* ---------- ficha del trago ---------- */
.backdrop{position:fixed;inset:0;background:rgba(10,6,4,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:21;padding:0 0 calc(env(safe-area-inset-bottom) + 24px)}
body.open .backdrop{opacity:1;pointer-events:auto}
body.open .sheet{transform:translate(-50%,0)}
.sheet .art{position:relative;margin:14px 14px 0}
.sheet .art img{display:block;width:100%;border-radius:20px;aspect-ratio:1;max-height:42dvh;object-fit:cover}
.sheet .close{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(42,29,22,.6);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.sheet .fav{top:10px;right:10px;width:40px;height:40px;font-size:21px}
.sheet .body{padding:16px 20px 0}
.sheet h2{margin:0;font-size:26px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chips span{background:#EFE4D2;color:#6b5646;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.sheet h3{margin:20px 0 8px;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#8a7a6c}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:12px;padding:9px 0;border-bottom:1.5px dashed #e6d9c5;font-size:15.5px}
.ing li b{flex:none;min-width:74px;font-weight:900}
.steps{margin:0;padding-left:22px;font-size:15.5px;line-height:1.45}
.steps li{margin:0 0 8px;padding-left:4px}
.steps li::marker{font-weight:900;color:#b7863a}
</style>

const BARS = [
  {id:'tiki',    tab:'Tiki',     sign:'Tiki Bar',     sub:'Ron, ananá y buena onda'},
  {id:'classic', tab:'Clásicos', sign:'Bar Clásico',  sub:'Los de siempre'},
  {id:'arg',     tab:'Mi bar',   sign:'Mi Bar',       sub:'Favoritos y argentinos'}
];
const BAR_NAME = {tiki:'Tiki Bar', classic:'Bar Clásico', arg:'Mi bar'};
const $ = s => document.querySelector(s);
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const byId = Object.fromEntries(DRINKS.map(d => [d.id, d]));

/* ---- favoritos (se guardan en el teléfono) ---- */
let favs = (()=>{ try{ const v = JSON.parse(localStorage.getItem('tragos.favs')); if(Array.isArray(v)) return v.filter(id=>byId[id]); }catch(e){} return ['fernet-coca']; })();
const saveFavs = ()=>{ try{ localStorage.setItem('tragos.favs', JSON.stringify(favs)); }catch(e){} };
const isFav = id => favs.includes(id);

/* ---- piezas ---- */
const tile = (d, origin) => `
  <div class="tile" role="button" tabindex="0" data-id="${d.id}">
    <img src="${d.img}" alt="${d.name}" loading="lazy">
    <button class="fav ${isFav(d.id)?'on':''}" data-fav="${d.id}" aria-label="Favorito">${isFav(d.id)?'★':'☆'}</button>
    <div class="plaque">${d.name}</div>${origin?`<span class="origin">${BAR_NAME[d.bar]}</span>`:''}
  </div>`;
const grid = (list, origin) => `<div class="grid">${list.map(d=>tile(d, origin)).join('')}</div>`;

function barContent(id){
  if(id !== 'arg') return grid(DRINKS.filter(d=>d.bar===id));
  const f = DRINKS.filter(d=>isFav(d.id));
  const rest = DRINKS.filter(d=>d.bar==='arg' && !isFav(d.id));
  let h = `<div class="shelf-title"><span>★ Mis favoritos</span></div>`;
  h += f.length ? grid(f) : `<div class="empty">Tocá la ☆ de cualquier trago para guardarlo acá.</div>`;
  if(rest.length) h += `<div class="shelf-title"><span>Argentinos</span></div>` + grid(rest);
  return h;
}

function render(){
  $('#pager').innerHTML = BARS.map(b => `
    <section class="bar ${b.id}" data-bar="${b.id}">
      <div class="roof"><div class="sign"><b>${b.sign}</b><small>${b.sub}</small></div></div>
      <div class="wall">${barContent(b.id)}<div class="pad"></div></div>
      <div class="counter"></div>
    </section>`).join('');
  $('#tabs').innerHTML = BARS.map((b,i)=>`<button class="tab" data-i="${i}">${b.tab}</button>`).join('');
  setActive(cur, false);
}

/* ---- navegación entre bares ---- */
let cur = 0;
try{ const s = parseInt(localStorage.getItem('tragos.bar')); if(s>=0 && s<BARS.length) cur = s; }catch(e){}
function setActive(i, remember=true){
  cur = i;
  document.body.dataset.bar = BARS[i].id;
  document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('on', k===i));
  if(remember){ try{ localStorage.setItem('tragos.bar', i); }catch(e){} }
}
function goTo(i, smooth=true){
  const p = $('#pager');
  p.scrollTo({left: i*p.clientWidth, behavior: smooth?'smooth':'auto'});
}
document.addEventListener('click', e=>{
  const t = e.target.closest('.tab');
  if(t){ goTo(+t.dataset.i); return; }
});
$('#pager').addEventListener('scroll', ()=>{
  const p = $('#pager'); const i = Math.round(p.scrollLeft / p.clientWidth);
  if(i !== cur) setActive(i);
}, {passive:true});

/* ---- ficha ---- */
function openSheet(id){
  const d = byId[id]; if(!d) return;
  $('#sheet').innerHTML = `
    <div class="art"><img src="${d.img}" alt="${d.name}">
      <button class="close" data-close aria-label="Cerrar">×</button>
      <button class="fav ${isFav(id)?'on':''}" data-fav="${id}" aria-label="Favorito">${isFav(id)?'★':'☆'}</button>
    </div>
    <div class="body">
      <h2>${d.name}</h2>
      <div class="chips"><span>${d.glass}</span><span>${d.method}</span>${d.garnish&&d.garnish!=='—'?`<span>🍊 ${d.garnish}</span>`:''}</div>
      <h3>Ingredientes</h3>
      <ul class="ing">${d.ing.map(([a,n])=>`<li><b>${a}</b><span>${n}</span></li>`).join('')}</ul>
      <h3>Preparación</h3>
      <ol class="steps">${d.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
    </div>`;
  $('#sheet').scrollTop = 0;
  $('#sheet').setAttribute('aria-hidden','false');
  document.body.classList.add('open');
}
function closeSheet(){ document.body.classList.remove('open'); $('#sheet').setAttribute('aria-hidden','true'); }
$('#backdrop').addEventListener('click', closeSheet);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); if((e.key==='Enter'||e.key===' ') && e.target.classList?.contains('tile')){ e.preventDefault(); openSheet(e.target.dataset.id);} });

document.addEventListener('click', e=>{
  if(e.target.closest('[data-close]')){ closeSheet(); return; }
  const f = e.target.closest('[data-fav]');
  if(f){
    e.stopPropagation();
    const id = f.dataset.fav;
    favs = isFav(id) ? favs.filter(x=>x!==id) : [...favs, id];
    saveFavs();
    const keepScroll = [...document.querySelectorAll('.bar')].map(b=>b.scrollTop);
    render();
    document.querySelectorAll('.bar').forEach((b,i)=>b.scrollTop = keepScroll[i]);
    goTo(cur, false);
    if(document.body.classList.contains('open')){ const sc=$('#sheet').scrollTop; openSheet(id); $('#sheet').scrollTop=sc; }
    runSearch();
    return;
  }
  const t = e.target.closest('.tile');
  if(t) openSheet(t.dataset.id);
});

/* ---- buscador ---- */
function runSearch(){
  const raw = $('#q').value.trim();
  $('#searchBox').classList.toggle('has', !!raw);
  const box = $('#results');
  if(!raw){ box.classList.remove('show'); box.innerHTML=''; return; }
  const terms = norm(raw).split(/\s+/).filter(Boolean);
  const hits = DRINKS.filter(d=>{
    const words = norm([d.name, d.tags, d.glass, d.method, d.garnish, ...d.ing.map(i=>i[1])].join(' ')).split(/[^a-z0-9]+/);
    return terms.every(t=>words.some(w=>w.startsWith(t)));
  });
  box.classList.add('show');
  box.innerHTML = hits.length
    ? `<p class="count">${hits.length} ${hits.length===1?'resultado':'resultados'}</p>${grid(hits,true)}`
    : `<p class="none">No encontré ningún trago con “${raw.replace(/</g,'&lt;')}”.</p>`;
  box.scrollTop = 0;
}
$('#q').addEventListener('input', runSearch);
$('#clear').addEventListener('click', ()=>{ $('#q').value=''; runSearch(); $('#q').focus(); });

render();
requestAnimationFrame(()=>goTo(cur, false));
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
</script>
</body>
</html>
